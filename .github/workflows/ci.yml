on:
  push:
    branches:
      - master
  pull_request:

name: Checks

jobs:
  check:
    name: sanity checks
    runs-on: ubuntu24.04-4cores-16GB
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@506bc9aed5e09b2051939748dedc43828ea9a52a # v1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - name: Install asdf & tools
        uses: asdf-vm/actions/install@1902764435ca0dd2f3388eea723a4f92a4eb8302 # v4.0.0
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features
      - name: cargo build
        run: cargo build --locked --bin afn --bin afn2proxy
